<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Feather Icons — thirty-one icons, feather light.
       Use on its own, or with ui/fonts.css and ui/buttons.css.
       Each icon uses currentColor only, so it flips with
       data-theme and with auto time mode, with no extra code.
       No hardcoded colours, no new colours.
       Use: <svg class="ft-icon" aria-hidden="true"><use href="ui/icons.svg#ft-home"/></svg>
       For a button with meaning, give the button an aria-label,
       and keep the icon aria-hidden. For a standalone icon that
       carries meaning, give the svg a title and role="img".
       Source: feather-themes for tokens, feather-speed for
       lightness, repoverse-master FEATHER_STANDARD.md for
       the budgets. Plain words, from empathy-marketing-skills. -->
