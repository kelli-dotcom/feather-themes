<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Feather Icons — ten icons only, feather light.
       Use on its own, or with ui/fonts.css and ui/buttons.css.
       Each icon uses currentColor only, so it flips with
       data-theme and with auto time mode, with no extra code.
       No hardcoded colours, no new colours.
       Use: <svg class="ft-icon" aria-hidden="true"><use href="ui/icons.svg#ft-home"/></svg>
       For a button with meaning, give the button an aria-label,
       and keep the icon aria-hidden. For a standalone icon that
       carries meaning, give the svg a title and role="img".
       Source: feather-themes for tokens, feather-speed for
       lightness, repoverse-master FEATHER_STANDARD.md for
       the budgets. Plain words, from empathy-marketing-skills. -->
  <symbol id="ft-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Home</title><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="ft-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><title>Menu</title><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="ft-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><title>Close</title><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="ft-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><title>Search</title><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
  <symbol id="ft-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Arrow right</title><path d="M4 12h16M13 5l7 7-7 7"/></symbol>
  <symbol id="ft-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Arrow left</title><path d="M20 12H4M11 5l-7 7 7 7"/></symbol>
  <symbol id="ft-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Check</title><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="ft-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Link</title><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></symbol>
  <symbol id="ft-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Mail</title><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="ft-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Star</title><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9L6.6 20l1-6.1L3.2 9.5l6.1-.9z"/></symbol>
</svg>
